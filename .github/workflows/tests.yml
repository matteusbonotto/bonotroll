name: Testes

# CI leve (Fase 5/6 do docs/BONOTTO-2027-BLUEPRINT.md, item opcional) — só
# roda os testes que já existem em tests/, tanto em push quanto em PR contra
# main. Não builda nada (o app não tem build step) e não faz deploy — deploy
# continua manual (git push origin main), como documentado no README.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run test:unit
      - run: npx playwright install --with-deps chromium
      - run: npm test
