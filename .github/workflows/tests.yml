name: Testes

# CI leve (Fase 5/6 do docs/BONOTTO-2027-BLUEPRINT.md, item opcional) — só
# roda os testes que já existem em tests/, tanto em push quanto em PR contra
# main, e confere que o build de produção (minificação + obfuscação +
# varredura de segredos) passa. Não faz deploy — deploy é manual
# (npm run deploy → Firebase Hosting, ver docs/DEPLOY-FIREBASE.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run test:unit
      - run: node scripts/build.mjs --demo
      - run: npx playwright install --with-deps chromium
      - run: npm test
