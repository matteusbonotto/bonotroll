  <p style="text-align:center;margin:28px 0">
    <a href="{{ .ConfirmationURL }}" style="background:#0E9F6E;color:#fff;text-decoration:none;font-weight:700;padding:14px 28px;border-radius:999px;display:inline-block">Confirmar meu e-mail</a>
