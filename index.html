<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1F7A5C" />
  <meta name="description" content="CasaGrana — controle financeiro pessoal e do grupo, com lista de compras integrada." />
  <title>CasaGrana — Controle Financeiro</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="./assets/icons/icon.svg" />

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body x-data>

  <div class="cg-offline-banner" x-show="!$store.app.online" x-cloak>
    <i class="bi bi-wifi-off"></i> Sem conexão — algumas ações serão guardadas e enviadas depois
  </div>

  <!-- Carregando sessão -->
  <template x-if="!$store.app.ready">
    <div class="d-flex align-items-center justify-content-center" style="min-height:100vh;">
      <div class="text-center">
        <div class="spinner-border" style="color: var(--color-primary);" role="status"></div>
        <p class="mt-3 cg-muted">Carregando CasaGrana…</p>
      </div>
    </div>
  </template>

  <!-- ============ TELA DE ENTRADA ============ -->
  <template x-if="$store.app.ready && !$store.app.profile">
    <div x-data="authView()" class="d-flex align-items-center justify-content-center p-3" style="min-height:100vh;">
      <div class="cg-card" style="max-width: 420px; width:100%;">
        <div class="text-center mb-4">
          <img src="./assets/icons/icon.svg" width="56" height="56" alt="" class="mb-2" />
          <h1 class="h4 fw-bold mb-1">CasaGrana</h1>
          <p class="cg-muted mb-0">Seu dinheiro e suas compras, num só lugar.</p>
        </div>

        <template x-if="$store.app.isDemoMode">
          <div class="mb-4">
            <p class="fw-semibold mb-2"><i class="bi bi-stars"></i> Modo demonstração — entre com um perfil de exemplo:</p>
            <div class="d-flex flex-column gap-2">
              <template x-for="p in $store.app.demoProfiles" :key="p.id">
                <button type="button" class="cg-btn cg-touch btn btn-outline-success text-start" @click="enterDemo(p.id)" :disabled="loading">
                  <span class="cg-avatar cg-avatar--sm" :style="{ borderColor: p.cor || 'var(--color-primary-soft)', background: p.cor || 'var(--color-primary)' }">
                    <template x-if="p.avatar_url"><img :src="p.avatar_url" :alt="p.nome" /></template>
                    <template x-if="!p.avatar_url"><span x-text="cgFormat.initials(p.nome)"></span></template>
                  </span>
                  <span class="ms-2">Entrar como <strong x-text="p.nome"></strong></span>
                </button>
              </template>
            </div>
            <p class="cg-muted small mt-3 mb-0">Os dados são fictícios e ficam só no seu navegador. Quando o Supabase for configurado, essa seção some.</p>
          </div>
        </template>

        <template x-if="!$store.app.isDemoMode">
          <form @submit.prevent="submit">
            <div class="mb-3" x-show="mode === 'signup'">
              <label class="form-label">Seu nome</label>
              <input type="text" class="form-control" x-model="nome" placeholder="Como podemos te chamar?" />
            </div>
            <div class="mb-3">
              <label class="form-label">E-mail</label>
              <input type="email" class="form-control" x-model="email" required placeholder="voce@email.com" />
            </div>
            <div class="mb-3">
              <label class="form-label">Senha</label>
              <input type="password" class="form-control" x-model="password" required minlength="6" placeholder="••••••••" />
            </div>

            <template x-if="error"><div class="alert alert-danger py-2 small" x-text="error"></div></template>
            <template x-if="info"><div class="alert alert-success py-2 small" x-text="info"></div></template>

            <button type="submit" class="cg-btn btn btn-success w-100" :disabled="loading">
              <span x-show="!loading" x-text="mode === 'signup' ? 'Criar conta' : 'Entrar'"></span>
              <span x-show="loading"><span class="spinner-border spinner-border-sm"></span> Aguarde…</span>
            </button>

            <p class="text-center mt-3 mb-0 small">
              <template x-if="mode === 'login'">
                <span>Ainda não tem conta? <a href="#" @click.prevent="mode = 'signup'">Criar conta</a></span>
              </template>
              <template x-if="mode === 'signup'">
                <span>Já tem conta? <a href="#" @click.prevent="mode = 'login'">Entrar</a></span>
              </template>
            </p>
          </form>
        </template>
      </div>
    </div>
  </template>

  <!-- ============ APP AUTENTICADO ============ -->
  <template x-if="$store.app.ready && $store.app.profile">
    <div class="cg-app-shell">

      <!-- Sidebar (desktop) -->
      <aside class="cg-sidebar">
        <div class="d-flex align-items-center gap-2 mb-4 px-1">
          <img src="./assets/icons/icon.svg" width="32" height="32" alt="" />
          <span class="fw-bold">CasaGrana</span>
        </div>
        <a href="#" class="cg-sidebar__item" :class="{ 'is-active': $store.app.view === 'home' }" @click.prevent="$store.app.setView('home')">
          <i class="bi bi-house-door"></i> Início
        </a>
        <a href="#" class="cg-sidebar__item" :class="{ 'is-active': $store.app.view === 'transacoes' }" @click.prevent="$store.app.setView('transacoes')">
          <i class="bi bi-table"></i> Transações
        </a>
        <a href="#" class="cg-sidebar__item" :class="{ 'is-active': $store.app.view === 'compras' }" @click.prevent="$store.app.setView('compras')">
          <i class="bi bi-cart3"></i> Lista de compras
        </a>
        <a href="#" class="cg-sidebar__item" :class="{ 'is-active': $store.app.view === 'grupo' }" @click.prevent="$store.app.setView('grupo')">
          <i class="bi bi-people"></i> Grupo
        </a>
        <a href="#" class="cg-sidebar__item" :class="{ 'is-active': $store.app.view === 'perfil' }" @click.prevent="$store.app.setView('perfil')">
          <i class="bi bi-person-circle"></i> Perfil
        </a>
        <div class="mt-auto pt-4">
          <a href="#" class="cg-sidebar__item text-danger" @click.prevent="$store.app.logout()">
            <i class="bi bi-box-arrow-right"></i> Sair
          </a>
        </div>
      </aside>

      <div class="cg-main">
        <!-- Topbar -->
        <header class="cg-topbar">
          <div>
            <h1 class="h5 fw-bold mb-0 d-lg-none">CasaGrana</h1>
          </div>
          <div x-data="{ menuOpen: false }" class="position-relative" @click.outside="menuOpen = false">
            <button type="button" class="btn p-0 border-0 bg-transparent d-flex align-items-center gap-2" @click="menuOpen = !menuOpen">
              <span class="cg-avatar cg-avatar--sm" :style="{ borderColor: $store.app.profile?.cor || 'var(--color-primary-soft)', background: $store.app.profile?.cor || 'var(--color-primary)' }">
                <template x-if="$store.app.profile?.avatar_url"><img :src="$store.app.profile.avatar_url" :alt="$store.app.profile.nome" /></template>
                <template x-if="!$store.app.profile?.avatar_url"><span x-text="cgFormat.initials($store.app.profile?.nome)"></span></template>
              </span>
              <span class="d-none d-md-inline fw-semibold" x-text="$store.app.profile?.nome"></span>
              <i class="bi bi-chevron-down small cg-muted"></i>
            </button>
            <div x-show="menuOpen" x-cloak x-transition class="cg-card position-absolute end-0 mt-2" style="min-width: 220px; z-index: 1040;">
              <template x-if="$store.app.isDemoMode && $store.app.demoProfiles.length">
                <div class="mb-2">
                  <p class="cg-muted small mb-1 fw-semibold">Trocar perfil (demo)</p>
                  <template x-for="p in $store.app.demoProfiles" :key="p.id">
                    <button type="button" class="btn btn-sm btn-outline-secondary w-100 text-start mb-1" @click="$store.app.loginDemo(p.id); menuOpen = false">
                      <span x-text="p.nome"></span>
                      <i class="bi bi-check2 float-end" x-show="$store.app.profile?.id === p.id"></i>
                    </button>
                  </template>
                  <hr class="my-2" />
                </div>
              </template>
              <button type="button" class="btn btn-sm btn-outline-secondary w-100 text-start mb-1" @click="$store.app.setView('perfil'); menuOpen = false">
                <i class="bi bi-gear"></i> Configurações
              </button>
              <button type="button" class="btn btn-sm btn-outline-danger w-100 text-start" @click="$store.app.logout()">
                <i class="bi bi-box-arrow-right"></i> Sair
              </button>
            </div>
          </div>
        </header>

        <template x-if="$store.app.isDemoMode">
          <div class="cg-demo-banner">
            <i class="bi bi-info-circle fs-5"></i>
            <span>Você está no <strong>modo demonstração</strong> — os dados abaixo são de exemplo e ficam salvos só neste navegador. Veja o README para conectar o Supabase de verdade.</span>
          </div>
        </template>

        <!-- ===== HOME ===== -->
        <section x-show="$store.app.view === 'home'" x-data="dashboardView()" x-init="init()">
          <div class="cg-section-title"><i class="bi bi-person-circle"></i> Olá, <span x-text="$store.app.profile?.nome?.split(' ')[0] || ''"></span></div>

          <div class="cg-hero-balance mb-4">
            <span class="cg-hero-balance__label">Saldo atual</span>
            <div class="cg-hero-balance__value" x-text="cgFormat.formatCurrency(personal.saldo)"></div>
            <div class="cg-hero-balance__row">
              <div class="cg-hero-stat">
                <i class="bi bi-download"></i>
                <div>
                  <span class="cg-hero-stat__label">Entradas</span>
                  <span class="cg-hero-stat__value" x-text="cgFormat.formatCurrency(personal.entradas)"></span>
                </div>
              </div>
              <div class="cg-hero-stat">
                <i class="bi bi-upload"></i>
                <div>
                  <span class="cg-hero-stat__label">Saídas</span>
                  <span class="cg-hero-stat__value" x-text="cgFormat.formatCurrency(personal.saidas)"></span>
                </div>
              </div>
              <div class="cg-hero-stat">
                <i class="bi bi-graph-up-arrow"></i>
                <div>
                  <span class="cg-hero-stat__label">Maior gasto</span>
                  <span class="cg-hero-stat__value" x-text="personal.maiorGasto ? cgFormat.formatCurrency(personal.maiorGasto.valor) : '—'"></span>
                </div>
              </div>
            </div>
          </div>

          <template x-if="$store.app.group">
            <div class="mb-4">
              <div class="cg-section-title"><i class="bi bi-people"></i> Resumo do grupo — <span x-text="$store.app.group.group.nome"></span></div>
              <div class="cg-grid-stats">
                <div class="cg-card cg-card--stat is-neutral">
                  <span class="cg-card__label">Saldo</span>
                  <span class="cg-card__value" x-text="cgFormat.formatCurrency(grupo.saldo)"></span>
                </div>
                <div class="cg-card cg-card--stat is-positive">
                  <span class="cg-card__label">Entradas</span>
                  <span class="cg-card__value" x-text="cgFormat.formatCurrency(grupo.entradas)"></span>
                </div>
                <div class="cg-card cg-card--stat is-negative">
                  <span class="cg-card__label">Saídas</span>
                  <span class="cg-card__value" x-text="cgFormat.formatCurrency(grupo.saidas)"></span>
                </div>
                <div class="cg-card cg-card--stat">
                  <span class="cg-card__label">Maior gasto</span>
                  <span class="cg-card__value" style="font-size:1.15rem;" x-text="grupo.maiorGasto ? cgFormat.formatCurrency(grupo.maiorGasto.valor) : '—'"></span>
                  <span class="cg-muted small text-truncate" x-text="grupo.maiorGasto?.titulo || 'Nenhum gasto ainda'"></span>
                </div>
              </div>
            </div>
          </template>

          <div class="d-flex flex-wrap gap-2 mb-4">
            <button type="button" class="cg-btn btn btn-success" @click="$store.txModal.openNew('saida')"><i class="bi bi-dash-circle"></i> Nova despesa</button>
            <button type="button" class="cg-btn btn btn-outline-success" @click="$store.txModal.openNew('saida', 'fixa')"><i class="bi bi-pin-angle"></i> Despesa fixa</button>
            <button type="button" class="cg-btn btn btn-outline-primary" @click="$store.txModal.openNew('entrada')"><i class="bi bi-plus-circle"></i> Nova entrada</button>
            <button type="button" class="cg-btn btn btn-outline-secondary" @click="$store.app.setView('compras')"><i class="bi bi-cart3"></i> Lista de compras</button>
          </div>

          <div class="cg-grid-dashboard mb-4">
            <div class="cg-card">
              <div class="cg-section-title"><i class="bi bi-exclamation-circle"></i> Contas a vencer</div>
              <template x-if="!contasAVencer.length"><p class="cg-muted small mb-0">Nada vencido ou vencendo nos próximos dias. 🎉</p></template>
              <div class="d-flex flex-column gap-2">
                <template x-for="t in contasAVencer" :key="t.id">
                  <div class="cg-due-row" :class="t._status === 'vencido' ? 'cg-due-row--overdue' : 'cg-due-row--soon'">
                    <div class="cg-due-row__icon"><i class="bi" :class="t._status === 'vencido' ? 'bi-exclamation-triangle-fill' : 'bi-clock-fill'"></i></div>
                    <div class="min-w-0 flex-fill">
                      <div class="fw-semibold text-truncate" x-text="t.titulo"></div>
                      <div class="small cg-due-row__meta" x-text="diasLabel(t)"></div>
                    </div>
                    <div class="fw-semibold flex-shrink-0" x-text="cgFormat.formatCurrency(t.valor)"></div>
                  </div>
                </template>
              </div>
            </div>

            <div class="cg-card">
              <div class="cg-section-title"><i class="bi bi-pie-chart"></i> Gastos por categoria</div>
              <template x-if="!categoriaResumo.length"><p class="cg-muted small mb-0">Sem dados suficientes ainda.</p></template>
              <template x-if="categoriaResumo.length">
                <div x-data="categoryChart()" x-init="$watch('categoriaResumo', v => render(v)); render(categoriaResumo)">
                  <div style="height:200px;"><canvas x-ref="canvas"></canvas></div>
                </div>
              </template>
            </div>
          </div>

          <div class="cg-card">
            <div class="cg-section-title mb-2"><i class="bi bi-clock-history"></i> Lançamentos recentes</div>
            <template x-if="!recentes.length"><p class="cg-muted small mb-0">Nada por aqui ainda.</p></template>
            <div class="d-flex flex-column gap-2">
              <template x-for="r in recentes" :key="r.id">
                <div class="d-flex align-items-center justify-content-between border-bottom pb-2">
                  <div class="min-w-0">
                    <div class="fw-semibold text-truncate" x-text="r.titulo"></div>
                    <div class="cg-muted small" x-text="(categoryFor(r.categoria_id)?.nome || 'Sem categoria') + ' · ' + (responsavelFor(r.responsavel_id)?.nome || '')"></div>
                  </div>
                  <div class="text-end ms-2">
                    <div :class="r.tipo === 'entrada' ? 'text-success fw-semibold' : 'text-danger fw-semibold'" x-text="(r.tipo === 'entrada' ? '+ ' : '- ') + cgFormat.formatCurrency(r.valor)"></div>
                    <span class="cg-badge" :class="'cg-badge--' + cgStatus.statusMeta(r._status).badge" x-text="cgStatus.statusMeta(r._status).label"></span>
                  </div>
                </div>
              </template>
            </div>
          </div>
        </section>

        <!-- ===== TRANSAÇÕES ===== -->
        <section x-show="$store.app.view === 'transacoes'" x-data="transactionsView()" x-init="init()">
          <div class="d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">
            <div class="cg-section-title mb-0"><i class="bi bi-table"></i> Transações</div>
            <div class="d-flex flex-wrap gap-2">
              <button type="button" class="cg-btn btn btn-success btn-sm" @click="novaSaida()"><i class="bi bi-dash-circle"></i> Despesa</button>
              <button type="button" class="cg-btn btn btn-outline-primary btn-sm" @click="novaEntrada()"><i class="bi bi-plus-circle"></i> Entrada</button>
              <button type="button" class="cg-btn btn btn-outline-secondary btn-sm" @click="abrirImportacao()"><i class="bi bi-upload"></i> Importar CSV</button>
              <button type="button" class="cg-btn btn btn-outline-secondary btn-sm" @click="exportar()"><i class="bi bi-download"></i> Exportar</button>
            </div>
          </div>

          <div class="cg-card mb-3">
            <div class="row g-2">
              <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" x-model="filtro.tipo">
                  <option value="">Movimentação</option>
                  <option value="entrada">Entrada</option>
                  <option value="saida">Saída</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" x-model="filtro.categoriaId">
                  <option value="">Categoria</option>
                  <template x-for="c in $store.app.categories" :key="c.id"><option :value="c.id" x-text="c.nome"></option></template>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" x-model="filtro.responsavelId">
                  <option value="">Responsável</option>
                  <option :value="$store.app.profile?.id" x-text="$store.app.profile?.nome"></option>
                  <template x-for="m in ($store.app.group?.members || [])" :key="m.id">
                    <option :value="m.id" x-text="m.nome" x-show="m.id !== $store.app.profile?.id"></option>
                  </template>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" x-model="filtro.status">
                  <option value="">Status</option>
                  <option value="pago">Pago</option>
                  <option value="a_vencer">A vencer</option>
                  <option value="vencido">Vencido</option>
                  <option value="pendente">Pendente</option>
                </select>
              </div>
              <div class="col-6 col-md-2">
                <select class="form-select form-select-sm" x-model="filtro.tipoDespesa">
                  <option value="">Fixa/Variável</option>
                  <option value="fixa">Fixa</option>
                  <option value="variavel">Variável</option>
                </select>
              </div>
              <div class="col-12 col-md-2">
                <input type="search" class="form-control form-control-sm" placeholder="Buscar…" x-model.debounce.400ms="filtro.busca" />
              </div>
            </div>
            <div class="row g-2 align-items-end mt-1">
              <div class="col-6 col-md-3">
                <label class="form-label small mb-1 cg-muted">Vencimento de</label>
                <input type="date" class="form-control form-control-sm" x-model="filtro.dataInicio" />
              </div>
              <div class="col-6 col-md-3">
                <label class="form-label small mb-1 cg-muted">até</label>
                <input type="date" class="form-control form-control-sm" x-model="filtro.dataFim" />
              </div>
              <div class="col-12 col-md-6 d-flex flex-wrap gap-2">
                <button type="button" class="btn btn-outline-secondary btn-sm" @click="aplicarMesAtual()">Este mês</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" @click="aplicarPeriodoRapido(7)">Próximos 7 dias</button>
                <button type="button" class="btn btn-outline-secondary btn-sm" @click="aplicarPeriodoRapido(-30)">Últimos 30 dias</button>
                <button type="button" class="btn btn-outline-secondary btn-sm ms-auto" @click="limparFiltros()"><i class="bi bi-x-circle"></i> Limpar filtros</button>
              </div>
            </div>
          </div>

          <template x-if="!loading && !sortedRows.length">
            <div class="cg-empty-state">
              <i class="bi bi-inbox"></i>
              <p class="mt-2 mb-0">Nenhum lançamento encontrado com esses filtros.</p>
            </div>
          </template>

          <div class="cg-scroll-x d-none d-md-block" x-show="sortedRows.length">
            <table class="table cg-table align-middle">
              <thead>
                <tr>
                  <th>Tipo</th>
                  <th role="button" @click="sortBy('tipo')">Mov.</th>
                  <th>Resp.</th>
                  <th role="button" @click="sortBy('titulo')">Título</th>
                  <th role="button" @click="sortBy('valor')">Valor</th>
                  <th>Categoria</th>
                  <th role="button" @click="sortBy('data_vencimento')">Vence</th>
                  <th>Pago em</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                <template x-for="row in sortedRows" :key="row.id">
                  <tr>
                    <td>
                      <button type="button" class="btn btn-sm p-0 border-0 bg-transparent" @click="toggleTipoDespesa(row)">
                        <i class="bi fs-5" :class="row.tipo_despesa === 'fixa' ? 'bi-pin-angle-fill text-warning' : 'bi-pin-angle cg-muted'" :title="row.tipo_despesa === 'fixa' ? 'Fixa — clique para marcar como variável' : 'Variável — clique para marcar como fixa'"></i>
                      </button>
                    </td>
                    <td>
                      <span class="cg-badge" :class="row.tipo === 'entrada' ? 'cg-badge--success' : 'cg-badge--danger'" :title="row.tipo === 'entrada' ? 'Entrada' : 'Saída'">
                        <i class="bi" :class="row.tipo === 'entrada' ? 'bi-download' : 'bi-upload'"></i>
                      </span>
                    </td>
                    <td x-data="{ open: false }" @click.outside="open = false">
                      <div class="position-relative">
                        <button type="button" class="cg-pill-trigger" @click="open = !open">
                          <span class="cg-avatar cg-avatar--sm" :style="{ borderColor: responsavelFor(row.responsavel_id)?.cor || 'var(--color-primary-soft)', background: responsavelFor(row.responsavel_id)?.cor || 'var(--color-primary)' }">
                            <template x-if="responsavelFor(row.responsavel_id)?.avatar_url"><img :src="responsavelFor(row.responsavel_id).avatar_url" :alt="responsavelFor(row.responsavel_id)?.nome" /></template>
                            <template x-if="!responsavelFor(row.responsavel_id)?.avatar_url"><span x-text="cgFormat.initials(responsavelFor(row.responsavel_id)?.nome)"></span></template>
                          </span>
                          <span class="text-truncate" x-text="responsavelFor(row.responsavel_id)?.nome"></span>
                          <i class="bi bi-chevron-down small cg-muted"></i>
                        </button>

              <div class="d-flex flex-column gap-2 mb-3">
                <template x-for="m in $store.app.group.members" :key="m.id">
                  <div class="d-flex align-items-center gap-2 border-bottom pb-2">
                    <span class="cg-avatar cg-avatar--sm" :style="{ borderColor: m.cor || 'var(--color-primary-soft)', background: m.cor || 'var(--color-primary)' }">
                      <template x-if="m.avatar_url"><img :src="m.avatar_url" :alt="m.nome" /></template>
                      <template x-if="!m.avatar_url"><span x-text="cgFormat.initials(m.nome)"></span></template>
                    </span>
                    <span x-text="m.nome"></span>
                    <span class="cg-muted small ms-auto" x-text="m.id === $store.app.group.group.criado_por ? 'Admin' : 'Membro'"></span>

                </template>
              </div>
              <div class="d-flex gap-2 flex-wrap">
                <button type="button" class="cg-btn btn btn-outline-danger" @click="sair()"><i class="bi bi-box-arrow-left"></i> Sair do grupo</button>
                <template x-if="souAdmin()">
                  <button type="button" class="cg-btn btn btn-outline-danger" @click="excluirGrupo()"><i class="bi bi-trash"></i> Excluir grupo</button>

        <section x-show="$store.app.view === 'perfil'" x-data="profileView()" x-init="init()">
          <div class="cg-section-title"><i class="bi bi-person-circle"></i> Perfil</div>
          <div class="row g-3">
            <div class="col-12 col-lg-5">
              <div class="cg-card h-100">
                <div class="cg-muted small fw-semibold text-uppercase mb-2">Identidade</div>
                <label class="form-label">Foto e cor</label>
                <div class="d-flex align-items-center gap-3 mb-3">
                  <span class="cg-avatar" style="width:72px;height:72px;font-size:1.4rem;" :style="{ borderColor: cor, background: cor }">
                    <template x-if="$store.app.profile?.avatar_url"><img :src="$store.app.profile.avatar_url" :alt="$store.app.profile.nome" /></template>
                    <template x-if="!$store.app.profile?.avatar_url"><span x-text="cgFormat.initials($store.app.profile?.nome)"></span></template>
                  </span>
                  <div class="d-flex flex-column gap-2">
                    <label class="cg-btn btn btn-outline-secondary btn-sm" style="cursor:pointer;">
                      <i class="bi bi-camera"></i> <span x-text="uploadingAvatar ? 'Enviando…' : 'Trocar foto'"></span>
                      <input type="file" accept="image/*" class="d-none" @change="onAvatarChange($event)" :disabled="uploadingAvatar" />
                    </label>
                    <div class="d-flex align-items-center gap-2">
                      <label class="small cg-muted mb-0">Cor da borda</label>
                      <input type="color" class="form-control form-control-color p-0" style="width:36px;height:36px;" x-model="cor" @change="salvarCor()" />

                  </div>
                </div>
                <label class="form-label">Nome</label>
                <div class="input-group mb-2">
                  <input type="text" class="form-control" x-model="nome" />
                  <button type="button" class="btn btn-success" @click="salvar()" :disabled="saving">Salvar</button>
                </div>
              </div>
            </div>

            <div class="col-12 col-lg-7">
              <div class="cg-muted small fw-semibold text-uppercase mb-2">Preferências</div>
              <div class="cg-card cg-card--hoverable mb-3" role="button" @click="$store.categoryModal.openManage()">
                <div class="d-flex align-items-center gap-3">
                  <div class="cg-icon-badge"><i class="bi bi-tags"></i></div>
                  <div class="flex-fill">
                    <h2 class="h6 fw-bold mb-1">Categorias</h2>
                    <p class="cg-muted small mb-0">Crie, edite ou exclua as categorias usadas em lançamentos e na lista de compras.</p>
                  </div>
                  <i class="bi bi-chevron-right cg-muted"></i>
                </div>
              </div>

              <template x-if="$store.app.isDemoMode">
                <div class="cg-card mb-3">
                  <h2 class="h6 fw-bold"><i class="bi bi-stars"></i> Modo demonstração</h2>
                  <p class="cg-muted small">Configure o Supabase (veja o README) para sair do modo demonstração e usar dados reais.</p>
                  <button type="button" class="cg-btn btn btn-outline-secondary" @click="resetarDemo()"><i class="bi bi-arrow-clockwise"></i> Restaurar dados de exemplo</button>
                </div>
              </template>

              <div class="cg-muted small fw-semibold text-uppercase mb-2">Conta</div>
              <button type="button" class="cg-btn btn btn-outline-danger" @click="$store.app.logout()"><i class="bi bi-box-arrow-right"></i> Sair da conta</button>
            </div>
          </div>
        </section>
      </div>

      <!-- Bottom nav (mobile) -->
      <nav class="cg-bottomnav">
        <button type="button" class="cg-bottomnav__item" :class="{ 'is-active': $store.app.view === 'home' }" @click="$store.app.setView('home')">
          <i class="bi bi-house-door"></i><span>Início</span>
        </button>
        <button type="button" class="cg-bottomnav__item" :class="{ 'is-active': $store.app.view === 'transacoes' }" @click="$store.app.setView('transacoes')">
          <i class="bi bi-table"></i><span>Transações</span>
        </button>
        <button type="button" class="cg-bottomnav__item" :class="{ 'is-active': $store.app.view === 'compras' }" @click="$store.app.setView('compras')">
          <i class="bi bi-cart3"></i><span>Compras</span>
        </button>
        <button type="button" class="cg-bottomnav__item" :class="{ 'is-active': $store.app.view === 'grupo' }" @click="$store.app.setView('grupo')">
          <i class="bi bi-people"></i><span>Grupo</span>
        </button>
        <button type="button" class="cg-bottomnav__item" :class="{ 'is-active': $store.app.view === 'perfil' }" @click="$store.app.setView('perfil')">
          <i class="bi bi-person-circle"></i><span>Perfil</span>
        </button>
      </nav>

      <button type="button" class="cg-fab" x-show="$store.app.view === 'home' || $store.app.view === 'transacoes'" @click="$store.txModal.openNew('saida')" aria-label="Nova despesa">
        <i class="bi bi-plus-lg"></i>
      </button>
    </div>
  </template>

  <!-- ============ MODAL: NOVA/EDITAR TRANSAÇÃO ============ -->
  <div class="cg-modal-backdrop" x-show="$store.txModal.open" x-cloak @click.self="$store.txModal.close()">
    <div class="cg-modal" x-show="$store.txModal.open" x-transition>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h6 fw-bold mb-0" x-text="$store.txModal.form.id ? 'Editar lançamento' : 'Novo lançamento'"></h2>
        <button type="button" class="btn-close" @click="$store.txModal.close()"></button>
      </div>

      <form @submit.prevent="$store.txModal.save()">
        <div class="btn-group w-100 mb-3" role="group">
          <input type="radio" class="btn-check" value="saida" x-model="$store.txModal.form.tipo" id="tipoSaida" />
          <label class="btn btn-outline-danger cg-touch" for="tipoSaida"><i class="bi bi-dash-circle"></i> Saída</label>
          <input type="radio" class="btn-check" value="entrada" x-model="$store.txModal.form.tipo" id="tipoEntrada" />
          <label class="btn btn-outline-success cg-touch" for="tipoEntrada"><i class="bi bi-plus-circle"></i> Entrada</label>
        </div>

        <div class="mb-3">
          <label class="form-label">Título</label>
          <input type="text" class="form-control" x-model="$store.txModal.form.titulo" placeholder="Ex: Aluguel, Mercado, Salário…" required />
        </div>

        <div class="row g-2 mb-3">
          <div class="col-7">
            <label class="form-label">Categoria</label>
            <select class="form-select" x-model="$store.txModal.form.categoria_id" @change="$store.txModal.onCategoriaChange()">
              <option value="">Sem categoria</option>
              <template x-for="c in $store.app.categories" :key="c.id"><option :value="c.id" x-text="c.nome"></option></template>
              <option value="__nova__">+ Nova categoria…</option>
            </select>
          </div>
          <div class="col-5">
            <label class="form-label">Valor (R$)</label>
            <input type="number" min="0" step="0.01" class="form-control" x-model="$store.txModal.form.valor" required />
          </div>
        </div>

        <button type="button" class="btn btn-link p-0 mb-3" @click="$store.txModal.showMore = !$store.txModal.showMore">
          <i class="bi" :class="$store.txModal.showMore ? 'bi-chevron-up' : 'bi-chevron-down'"></i>
          <span x-text="$store.txModal.showMore ? 'Menos opções' : 'Mais opções'"></span>
        </button>

        <div x-show="$store.txModal.showMore" x-cloak>
          <div class="mb-3">
            <label class="form-label">Empresa / Serviço</label>
            <input type="text" class="form-control" x-model="$store.txModal.form.empresa_servico" placeholder="Opcional" />
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label">Tipo de despesa</label>
              <select class="form-select" x-model="$store.txModal.form.tipo_despesa">
                <option value="variavel">Variável</option>
                <option value="fixa">Fixa</option>
              </select>
            </div>
            <div class="col-6">
              <label class="form-label">Responsável</label>
              <select class="form-select" x-model="$store.txModal.form.responsavel_id">
                <option :value="$store.app.profile?.id" x-text="$store.app.profile?.nome"></option>
                <template x-for="m in ($store.app.group?.members || [])" :key="m.id">
                  <option :value="m.id" x-text="m.nome" x-show="m.id !== $store.app.profile?.id"></option>
                </template>
              </select>
            </div>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label">Cadastro</label>
              <input type="date" class="form-control" x-model="$store.txModal.form.data_cadastro" />
            </div>
            <div class="col-6">
              <label class="form-label">Vencimento</label>
              <input type="date" class="form-control" x-model="$store.txModal.form.data_vencimento" />
            </div>
          </div>

          <div class="mb-3">
            <div class="form-check mb-2">
              <input type="checkbox" class="form-check-input" id="marcarPago" :checked="!!$store.txModal.form.data_pagamento" @change="$store.txModal.onPagoChange($event.target.checked)" />
              <label class="form-check-label" for="marcarPago">Já está pago</label>
            </div>
            <template x-if="$store.txModal.form.data_pagamento">
              <input type="date" class="form-control" style="max-width: 200px;" x-model="$store.txModal.form.data_pagamento" />
            </template>
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="recorrente" x-model="$store.txModal.form.recorrente" />
            <label class="form-check-label" for="recorrente">É uma despesa recorrente (mensal)</label>
          </div>

          <div class="mb-3">
            <label class="form-label">Comprovante</label>
            <p class="cg-muted small mb-2">A foto também tenta preencher título e valor sozinha (confira antes de salvar — a leitura não é 100% confiável).</p>
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <label class="cg-btn btn btn-outline-secondary btn-sm" style="cursor:pointer;">
                <i class="bi bi-camera"></i>
                <span x-text="$store.txModal.uploadingComprovante ? 'Enviando…' : ($store.txModal.lendoComprovante ? 'Lendo dados…' : ($store.txModal.form.comprovante_url ? 'Trocar foto' : 'Anexar foto'))"></span>
                <input type="file" accept="image/*,.pdf" capture="environment" class="d-none" @change="$store.txModal.onComprovanteChange($event)" :disabled="$store.txModal.uploadingComprovante || $store.txModal.lendoComprovante" />
              </label>
              <a :href="$store.txModal.comprovantePreviewUrl" target="_blank" rel="noopener" class="small" x-show="$store.txModal.comprovantePreviewUrl">Ver anexo</a>
              <button type="button" class="btn btn-sm btn-outline-danger" @click="$store.txModal.removerComprovante()" x-show="$store.txModal.form.comprovante_url">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Observações</label>
            <textarea class="form-control" rows="2" x-model="$store.txModal.form.observacoes" placeholder="Opcional"></textarea>
          </div>
        </div>

        <div class="d-flex gap-2 mt-2">
          <template x-if="$store.txModal.form.id">
            <button type="button" class="cg-btn btn btn-outline-danger" @click="$store.txModal.remove()"><i class="bi bi-trash"></i></button>
          </template>
          <button type="button" class="cg-btn btn btn-outline-secondary flex-fill" @click="$store.txModal.close()">Cancelar</button>
          <button type="submit" class="cg-btn btn btn-success flex-fill" :disabled="$store.txModal.saving">
            <span x-show="!$store.txModal.saving">Salvar</span>
            <span x-show="$store.txModal.saving"><span class="spinner-border spinner-border-sm"></span></span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ============ MODAL: CATEGORIAS (criar/editar/excluir) ============ -->
  <div class="cg-modal-backdrop" x-show="$store.categoryModal.open" x-cloak @click.self="$store.categoryModal.close()">
    <div class="cg-modal" x-show="$store.categoryModal.open" x-transition>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h6 fw-bold mb-0">Categorias</h2>
        <button type="button" class="btn-close" @click="$store.categoryModal.close()"></button>
      </div>

      <div class="mb-3 p-3" style="border: 1px solid var(--color-border); border-radius: var(--radius-md);">
        <h3 class="h6 fw-semibold mb-2" x-text="$store.categoryModal.editingId ? 'Editar categoria' : 'Nova categoria'"></h3>
        <div class="d-flex gap-2 mb-2">
          <input type="text" class="form-control form-control-sm" placeholder="Nome da categoria" x-model="$store.categoryModal.nome" @keydown.enter.prevent="$store.categoryModal.salvar()" />
          <input type="color" class="form-control form-control-color form-control-sm p-0" style="width:36px;" x-model="$store.categoryModal.cor" />
        </div>
        <div class="btn-group btn-group-sm mb-2 w-100" role="group">
          <button type="button" class="btn" :class="$store.categoryModal.modoIcone === 'preset' ? 'btn-secondary' : 'btn-outline-secondary'" @click="$store.categoryModal.modoIcone = 'preset'">Ícone</button>
          <button type="button" class="btn" :class="$store.categoryModal.modoIcone === 'upload' ? 'btn-secondary' : 'btn-outline-secondary'" @click="$store.categoryModal.modoIcone = 'upload'">Imagem</button>
          <button type="button" class="btn" :class="$store.categoryModal.modoIcone === 'url' ? 'btn-secondary' : 'btn-outline-secondary'" @click="$store.categoryModal.modoIcone = 'url'">URL</button>
        </div>
        <template x-if="$store.categoryModal.modoIcone === 'preset'">
          <div class="d-flex flex-wrap gap-1 mb-2">
            <template x-for="ic in $store.categoryModal.iconePresets" :key="ic">
              <button type="button" class="btn btn-sm p-0" style="width:34px;height:34px;" :class="$store.categoryModal.icone === ic ? 'btn-success' : 'btn-outline-secondary'" @click="$store.categoryModal.icone = ic">
                <i :class="'bi ' + ic"></i>
              </button>
            </template>
          </div>
        </template>
        <template x-if="$store.categoryModal.modoIcone === 'upload'">
          <div class="mb-2 d-flex align-items-center gap-2">
            <label class="cg-btn btn btn-outline-secondary btn-sm mb-0" style="cursor:pointer;">
              <i class="bi bi-upload"></i>
              <span x-text="$store.categoryModal.uploadingIcone ? 'Enviando…' : ($store.categoryModal.iconeUrl ? 'Trocar imagem' : 'Escolher imagem')"></span>
              <input type="file" accept="image/*" class="d-none" @change="$store.categoryModal.onIconeFile($event)" :disabled="$store.categoryModal.uploadingIcone" />
            </label>
            <img :src="$store.categoryModal.iconeUrl" x-show="$store.categoryModal.iconeUrl" style="width:28px;height:28px;border-radius:50%;object-fit:cover;" />
          </div>
        </template>
        <template x-if="$store.categoryModal.modoIcone === 'url'">
          <input type="url" class="form-control form-control-sm mb-2" placeholder="https://…" x-model="$store.categoryModal.iconeUrlInput" />
        </template>
        <div class="d-flex gap-2">
          <button type="button" class="btn btn-success btn-sm flex-fill" :disabled="$store.categoryModal.saving" @click="$store.categoryModal.salvar()">
            <span x-text="$store.categoryModal.editingId ? 'Salvar alterações' : 'Criar categoria'"></span>
          </button>
          <button type="button" class="btn btn-outline-secondary btn-sm" x-show="$store.categoryModal.editingId" @click="$store.categoryModal.resetForm()">Cancelar</button>
        </div>
      </div>

      <template x-if="!$store.categoryModal.onCreated">
        <div>
          <h3 class="h6 fw-semibold mb-2">Minhas categorias</h3>
          <div class="d-flex flex-column gap-2" style="max-height: 320px; overflow-y: auto;">
            <template x-for="c in $store.app.categories" :key="c.id">
              <div class="cg-list-row d-flex align-items-center gap-2 p-2">
                <span class="cg-chip cg-chip--icon-only" :style="{ background: c.cor }">
                  <template x-if="c.icone_url"><img :src="c.icone_url" class="cg-chip__icon-img" /></template>
                  <template x-if="!c.icone_url"><i :class="'bi ' + (c.icone || 'bi-tag')"></i></template>
                </span>
                <span class="flex-fill text-truncate" x-text="c.nome"></span>
                <button type="button" class="btn btn-sm btn-outline-secondary" @click="$store.categoryModal.editCategory(c)"><i class="bi bi-pencil"></i></button>
                <button type="button" class="btn btn-sm btn-outline-danger" @click="$store.categoryModal.excluir(c)"><i class="bi bi-trash"></i></button>
              </div>
            </template>
            <p class="cg-muted small mb-0" x-show="!$store.app.categories.length">Nenhuma categoria ainda.</p>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ MODAL: IMPORTAR CSV ============ -->
  <div class="cg-modal-backdrop" x-show="$store.csvModal.open" x-cloak @click.self="$store.csvModal.close()">
    <div class="cg-modal" x-show="$store.csvModal.open" x-transition>
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h6 fw-bold mb-0">Importar CSV — <span x-text="$store.csvModal.IMPORT_TARGETS[$store.csvModal.target].label"></span></h2>
        <button type="button" class="btn-close" @click="$store.csvModal.close()"></button>
      </div>

      <template x-if="$store.csvModal.step === 'upload'">
        <div>
          <p class="cg-muted small">Selecione um arquivo .csv com cabeçalho na primeira linha.</p>
          <input type="file" accept=".csv" class="form-control" @change="$store.csvModal.onFile($event)" />
        </div>
      </template>

      <template x-if="$store.csvModal.step === 'map'">
        <div>
          <p class="cg-muted small">Associe cada campo do CasaGrana a uma coluna do seu arquivo.</p>
          <template x-for="f in $store.csvModal.fields()" :key="f.key">
            <div class="row g-2 align-items-center mb-2">
              <div class="col-5"><span class="small fw-semibold" x-text="f.label"></span> <span class="text-danger" x-show="f.required">*</span></div>
              <div class="col-7">
                <select class="form-select form-select-sm" x-model="$store.csvModal.mapping[f.key]">
                  <option value="">— não importar —</option>
                  <template x-for="h in $store.csvModal.headers" :key="h"><option :value="h" x-text="h"></option></template>
                </select>
              </div>
            </div>
          </template>
          <button type="button" class="cg-btn btn btn-success w-100 mt-2" @click="$store.csvModal.avancarPreview()">Continuar</button>
        </div>
      </template>

      <template x-if="$store.csvModal.step === 'preview'">
        <div>
          <p class="cg-muted small" x-text="$store.csvModal.rawRows.length + ' linha(s) serão importadas.'"></p>
          <div class="cg-scroll-x mb-3" style="max-height:260px; overflow-y:auto;">
            <table class="table table-sm">
              <thead><tr><template x-for="f in $store.csvModal.fields()" :key="f.key"><th x-text="f.label"></th></template></tr></thead>
              <tbody>
                <template x-for="(row, i) in $store.csvModal.rawRows.slice(0, 8)" :key="i">
                  <tr>
                    <template x-for="f in $store.csvModal.fields()" :key="f.key">
                      <td x-text="row[$store.csvModal.mapping[f.key]] ?? ''"></td>
                    </template>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
          <button type="button" class="cg-btn btn btn-success w-100" @click="$store.csvModal.confirmar()">Importar agora</button>
        </div>
      </template>

      <template x-if="$store.csvModal.step === 'resultado'">
        <div>
          <div class="alert alert-success" x-text="$store.csvModal.result.ok + ' registro(s) importado(s) com sucesso.'"></div>
          <template x-if="$store.csvModal.result.erros.length">
            <div class="alert alert-warning">
              <p class="fw-semibold mb-1">Linhas com erro:</p>
              <ul class="mb-0 small">
                <template x-for="e in $store.csvModal.result.erros" :key="e.linha">
                  <li><span x-text="'Linha ' + e.linha + ': ' + e.motivo"></span></li>
                </template>
              </ul>
            </div>
          </template>
          <button type="button" class="cg-btn btn btn-outline-secondary w-100" @click="$store.csvModal.close()">Fechar</button>
        </div>
      </template>
    </div>
  </div>

  <!-- ============ TOAST ============ -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:2000; max-width: 320px; pointer-events: none;">
    <template x-if="$store.app.toast">
      <div class="cg-card" style="pointer-events: auto;" :class="{
        'border-success': $store.app.toast.type === 'success',
        'border-danger': $store.app.toast.type === 'danger'
      }" x-text="$store.app.toast.message"></div>
    </template>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
</body>
</html>
